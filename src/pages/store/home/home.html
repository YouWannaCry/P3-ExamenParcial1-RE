<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store | Catalogo</title>
  <script>
    const savedTheme = localStorage.getItem("foodStoreTheme");
    document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <header class="store-header">
    <a class="brand" href="/store/menu" aria-label="Food Store">
      <span class="brand-mark">FS</span>
      <span>Food Store</span>
    </a>
    <nav class="store-nav" aria-label="Navegacion principal">
      <a href="/store/menu" aria-current="page">Catalogo</a>
      <a class="cart-link" href="/store/cart" aria-label="Ver carrito">
        <span class="cart-icon" aria-hidden="true">&#128722;</span>
        <span id="cartTotalHeader" class="cart-link-total">$ 0</span>
      </a>
      <label class="theme-switch" aria-label="Cambiar tema">
        <input id="themeToggle" type="checkbox" />
        <span class="theme-switch-track" aria-hidden="true">
          <span class="theme-icon theme-icon-sun">&#9728;</span>
          <span class="theme-icon theme-icon-moon">&#9790;</span>
          <span class="theme-switch-thumb"></span>
        </span>
      </label>
    </nav>
  </header>

  <main class="store-shell">
    <section class="catalog-section" aria-labelledby="catalogTitle">
      <div class="catalog-toolbar">
        <div>
          <p class="eyebrow">Productos disponibles</p>
          <h1 id="catalogTitle">Catalogo</h1>
        </div>
        <div class="catalog-actions">
          <div class="category-menu">
            <button
              id="categoryMenuButton"
              class="icon-button"
              type="button"
              aria-expanded="false"
              aria-controls="categoryList"
              aria-label="Abrir categorias"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>
            <div id="categoryList" class="category-list" hidden></div>
          </div>
        <label class="search-control" for="searchInput">
          <span>Buscar</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Pizza, hamburguesa..." />
        </label>
        </div>
      </div>

      <p id="activeFilter" class="active-filter"></p>
      <div id="productGrid" class="category-sections"></div>
      <p id="emptyMessage" class="empty-state" hidden>No se encontraron productos para la busqueda seleccionada.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/src/pages/store/home/home.ts"></script>
</body>

</html>
