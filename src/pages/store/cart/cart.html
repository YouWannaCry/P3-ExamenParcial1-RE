<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Store | Carrito</title>
  <script>
    const savedTheme = localStorage.getItem("foodStoreTheme");
    document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <header class="store-header">
    <a class="brand" href="/store/menu" aria-label="Food Store">
      <span class="brand-mark">FS</span>
      <span>Food Store</span>
    </a>
    <nav class="store-nav" aria-label="Navegacion principal">
      <a href="/store/menu">Catalogo</a>
      <a class="cart-link" href="/store/cart" aria-current="page" aria-label="Ver carrito">
        <span class="cart-icon" aria-hidden="true">&#128722;</span>
        <span id="cartTotalHeader" class="cart-link-total">$ 0</span>
      </a>
      <label class="theme-switch" aria-label="Cambiar tema">
        <input id="themeToggle" type="checkbox" />
        <span class="theme-switch-track" aria-hidden="true">
          <span class="theme-icon theme-icon-sun">&#9728;</span>
          <span class="theme-icon theme-icon-moon">&#9790;</span>
          <span class="theme-switch-thumb"></span>
        </span>
      </label>
    </nav>
  </header>

  <main class="cart-shell">
    <section class="cart-section" aria-labelledby="cartTitle">
      <div class="cart-heading">
        <div>
          <p class="eyebrow">Resumen</p>
          <h1 id="cartTitle">Carrito de compras</h1>
        </div>
        <a class="secondary-button" href="/store/menu">Seguir comprando</a>
      </div>

      <p id="cartNotice" class="cart-notice" hidden></p>
      <div id="cartItems" class="cart-items"></div>
      <p id="emptyCartMessage" class="empty-state" hidden>El carrito esta vacio. Agrega productos desde el catalogo.</p>
    </section>

    <aside class="total-panel" aria-label="Total del carrito">
      <p class="eyebrow">Total</p>
      <strong id="cartTotal">$ 0</strong>
      <button id="clearCartButton" class="danger-button" type="button">Vaciar carrito</button>
    </aside>
  </main>

  <script type="module" src="/src/pages/store/cart/cart.ts"></script>
</body>

</html>
